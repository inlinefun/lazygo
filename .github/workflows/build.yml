on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite

jobs:
  build_debug:
    name: Build Debug variant
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew assembleDebug

  build_release:
    name: Build Release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew assembleRelease